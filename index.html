<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28q Playground</title>
<style>
:root{
  --bg:#0b0d10;
  --panel:#12161b;
  --panel2:#171c22;
  --text:#e9eef5;
  --muted:#9aa7b5;
  --line:#2b3440;
  --accent:#67b7ff;
  --ok:#71d39a;
  --disabled:#6f7b88;
  --shadow:0 12px 34px rgba(0,0,0,.26);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(103,183,255,.08),transparent 28rem),
    var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  line-height:1.45;
}
a{color:inherit;text-decoration:none}
header{
  border-bottom:1px solid var(--line);
  background:rgba(11,13,16,.9);
  backdrop-filter:blur(10px);
}
.wrap{max-width:1120px;margin:auto;padding:22px 20px}
.hero{padding-top:46px;padding-bottom:34px}
.eyebrow{
  color:var(--accent);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:8px;
}
h1{margin:0;font-size:30px;line-height:1.2}
.hero p{margin:10px 0 0;color:var(--muted);font-size:13px;max-width:680px}

main.wrap{padding-top:22px;padding-bottom:64px}
.category{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
}
.category-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:14px;
}
.category-head h2{font-size:18px;margin:0}
.category-head .count{font-size:11px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.card{
  display:flex;
  flex-direction:column;
  min-height:168px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel2);
  transition:.16s ease;
}
.card.enabled:hover{
  transform:translateY(-2px);
  border-color:#45617c;
  background:#1a2129;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.card.disabled{
  opacity:.52;
  cursor:not-allowed;
}
.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.card h3{margin:0;font-size:16px}
.badge{
  flex:0 0 auto;
  border:1px solid #40505f;
  border-radius:999px;
  padding:2px 7px;
  font-size:10px;
  color:#bdc9d5;
}
.badge.live{
  color:var(--ok);
  border-color:#35624a;
  background:rgba(113,211,154,.06);
}
.card p{
  color:var(--muted);
  font-size:12px;
  margin:12px 0 16px;
}
.card-footer{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:#c8d4df;
  font-size:12px;
}
.open{
  color:var(--accent);
}
.soon{
  color:var(--disabled);
}

footer{
  color:var(--muted);
  font-size:11px;
  padding:0 20px 26px;
  text-align:center;
}

@media(max-width:780px){
  .grid{grid-template-columns:1fr}
  .hero{padding-top:30px;padding-bottom:24px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hero">
    <div class="eyebrow">28q / playground</div>
    <h1>Playground</h1>
    <p>作った解析ツールやシミュレータを置くページ。</p>
  </div>
</header>

<main class="wrap">
  <section class="category">
    <div class="category-head">
      <h2>駅伝</h2>
      <span class="count">1 / 3 implemented</span>
    </div>

    <div class="grid">
      <div class="card disabled" aria-disabled="true">
        <div class="card-top">
          <h3>全日本駅伝</h3>
          <span class="badge">未実装</span>
        </div>
        <p>全日本駅伝向けの解析・シミュレーション。</p>
        <div class="card-footer">
          <span>Coming soon</span>
          <span class="soon">—</span>
        </div>
      </div>

      <a class="card enabled" href="./izumo_simulator.html">
        <div class="card-top">
          <h3>出雲駅伝</h3>
          <span class="badge live">実装済み</span>
        </div>
        <p>選手能力から6区間の最適配置を探索し、タイム分布を計算するシミュレータ。</p>
        <div class="card-footer">
          <span>出雲駅伝タイム解析ツール</span>
          <span class="open">開く →</span>
        </div>
      </a>

      <div class="card disabled" aria-disabled="true">
        <div class="card-top">
          <h3>箱根駅伝</h3>
          <span class="badge">未実装</span>
        </div>
        <p>箱根駅伝向けの解析・シミュレーション。</p>
        <div class="card-footer">
          <span>Coming soon</span>
          <span class="soon">—</span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>28q playground</footer>
</body>
</html>
