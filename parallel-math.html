try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved){if(saved.bests&&typeof saved.bests==='object'){for(const [k,r] of Object.entries(saved.bests)){if(r&&r.success&&r.ranked&&Number.isFinite(r.time)&&r.time>=0&&r.config)bests[k]=r;}}if(saved.config&&[2,3,4].includes(saved.config.tiles)&&['easy','hard'].includes(saved.config.level)&&['integer','fraction'].includes(saved.config.number)&&[5,10,15,20].includes(saved.config.steps))config={...saved.config};if(Array.isArray(saved.records))records=saved.records.filter(r=>r&&Number.isFinite(r.time)&&r.time>=0&&r.config&&[2,3,4].includes(r.config.tiles)&&['easy','hard'].includes(r.config.level)&&['integer','fraction'].includes(r.config.number)&&[5,10,15,20].includes(r.config.steps)&&Number.isFinite(r.date)&&Array.isArray(r.correct)).slice(0,100);}}catch{storageOK=false;}
function save(){try{localStorage.setItem(STORE,JSON.stringify({config,records,bests}));return true;}catch{storageOK=false;return false;}}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=c=>`${c.tiles}-${c.level}-${c.level==='hard'?'linear':c.number}-${c.steps}`;
records.filter(r=>r.success&&r.ranked).forEach(r=>{const k=key(r.config);if(!bests[k]||r.time<bests[k].time)bests[k]=r;});
const best=c=>bests[key(c)]?.time??Infinity;
const time=t=>(t/1000).toFixed(2),label=c=>`${c.tiles}タイル / ${c.level==='easy'?'Easy · '+(c.number==='integer'?'整数':'分数'):'Hard · 一次式'} / ${c.steps}手`;
function announce(t){$('#announcer').textContent=t;}
function stopTimers(){clearInterval(countdownId);clearInterval(clockId);countdownId=clockId=null;}
function nav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.nav').forEach(b=>b.disabled=['countdown','running','answer'].includes(phase));}
function segment(name,options){return `<div class="segments ${name==='level'?'levels':''}" role="group" aria-label="${({tiles:'タイル数',level:'計算の難しさ',number:'数の種類',steps:'手数'})[name]}">${options.map(([v,text,sub])=>`<button data-setting="${name}" data-value="${v}" class="${String(config[name])===String(v)?'selected':''}" aria-pressed="${String(config[name])===String(v)}">${sub?`<strong>${text}</strong><small>${sub}</small>`:text}</button>`).join('')}</div>`;}
function tile(n,content,tag='START',extra=''){return `<article class="tile ${extra}"><div class="tile-head"><span class="tile-letter">${letters[n]}</span><span>${tag}</span></div>${content}</article>`;}
function number(p){const v=typeof p==='string'?p:E.fmt(p);return `<div class="tile-number ${v.length>5?'compact':''}">${escape(v)}</div>`;}
function shellTitle(eye,title,desc){return `<div class="eyebrow">${eye}</div><h1 class="page-title">${title}</h1><p class="muted">${desc}</p>`;}
function setup(){phase='setup';page='play';stopTimers();nav();const b=best(config),demo=config.level==='hard'?['2x + 3','x − 4','−x + 2','3x − 1']:['7','4','9','2'];
main.innerHTML=`<div class="intro"><div><div class="eyebrow">A little focus. A parallel mind.</div><h1>いくつの計算を、追いかけられる？</h1><p>タイルごとに変わる数字を、頭の中でアップデート。<br>最後の答えをそろえて、自分のベストを超えよう。</p></div><div class="intro-note">FOCUS × MEMORY × SPEED</div></div><div class="setup-layout"><section class="panel settings"><div class="panel-heading"><h2>チャレンジ設定</h2><span class="tiny">YOUR CHALLENGE</span></div><div class="field"><div class="field-label">タイル数 <small>同時に追いかける数</small></div>${segment('tiles',[[2,'2'],[3,'3'],[4,'4']])}</div><div class="field"><div class="field-label">計算の難しさ</div>${segment('level',[['easy','Easy','数字を計算'],['hard','Hard','一次式を計算']])}<p class="field-note">${config.level==='hard'?'途中の計算も必ず ax + b の形です。':'まずは数字の計算から、集中力をウォームアップ。'}</p></div>${config.level==='easy'?`<div class="field"><div class="field-label">数の種類</div>${segment('number',[['integer','整数'],['fraction','簡単な分数']])}</div>`:`<div class="field"><div class="field-label">式のルール <small>一次式以下</small></div><p class="field-note">足し引きは式も登場。掛け算・割り算は<br>定数だけなので、二次式にはなりません。</p></div>`}<div class="field"><div class="field-label">手数 <small>タイルごとの演算回数</small></div>${segment('steps',[[5,'5'],[10,'10'],[15,'15'],[20,'20']])}</div><button class="start-btn" id="start">チャレンジをはじめる <span class="arrow">↗</span></button><p class="button-sub">3秒のカウントダウン後にスタート</p></section><section class="panel preview"><div class="preview-top"><span class="tiny">THE PLAYING FIELD</span><span class="pill">${config.tiles} TILES · ${config.steps} STEPS</span></div><div class="demo-area"><div class="tiles" style="--tiles:${config.tiles}">${demo.slice(0,config.tiles).map((n,i)=>tile(i,number(n))).join('')}</div><p class="demo-label"><span>PREVIEW</span> それぞれのタイルを、同時に計算します</p></div><div class="preview-bottom"><div class="icon">⚑</div><div><strong>この設定の自己ベスト</strong><p>${b<Infinity?'次は、このタイムの先へ。':'最初のクリアが、あなたの基準になる。'}</p></div><div class="best-time">${b<Infinity?time(b)+'<small style="font-size:10px;letter-spacing:0"> 秒</small>':'— —'}</div></div></section></div><div class="how-strip"><div class="how-step"><span class="step-no">01 / REMEMBER</span><div><strong>最初の数字・式を覚える</strong><p>タイルごとのスタート値を記憶。</p></div></div><div class="how-step"><span class="step-no">02 / CALCULATE</span><div><strong>演算を見て、頭の中で更新</strong><p>計算できたら <kbd>Space</kbd> で次の手へ。</p></div></div><div class="how-step"><span class="step-no">03 / ANSWER</span><div><strong>最後の答えを入力</strong><p>全問正解したときのタイムがスコアに。</p></div></div></div>${!storageOK?'<div class="notice">このブラウザでは記録を保存できません。ゲームはそのまま遊べます。</div>':''}`;
main.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{config[b.dataset.setting]=['tiles','steps'].includes(b.dataset.setting)?Number(b.dataset.value):b.dataset.value;save();setup();});$('#start').onclick=begin;}
function begin(){stopTimers();game=E.generate(config);round=-1;hiddenRun=false;submitted=[];outcome=null;phase='countdown';page='play';nav();let remaining=3;const draw=()=>{main.innerHTML=`<div class="game"><div class="game-head"><button class="text-btn" id="quit">← 設定に戻る</button><span class="game-meta">${escape(label(config))}</span></div><div class="countdown"><div class="eyebrow">GET READY</div><strong>${remaining}</strong><p>${config.tiles}つのタイルに、集中。</p></div></div>`;$('#quit').onclick=setup;announce(String(remaining));};draw();countdownId=setInterval(()=>{remaining--;if(remaining>0)draw();else{clearInterval(countdownId);countdownId=null;phase='running';start=performance.now();renderGame();clockId=setInterval(updateTimer,50);}},1000);}
function updateTimer(){const el=$('#timer');if(el)el.textContent=time(performance.now()-start);}
function gameTop(){return `<div class="game-head"><button class="text-btn" id="quit">← 中止して設定へ</button><span class="game-meta">${escape(label(config))}</span><span class="timer"><span id="timer">${time(performance.now()-start)}</span><small style="font-size:10px;letter-spacing:0"> 秒</small></span></div>`;}
function renderGame(){nav();const isStart=round<0,isLast=round===config.steps-1;main.innerHTML=`<div class="game">${gameTop()}<div class="game-title"><div class="tiny">${isStart?'REMEMBER THE START':'KEEP THEM IN YOUR MIND'}</div><h1>${isStart?'スタート値を覚えよう':'それぞれの答えを更新しよう'}</h1><p>${isStart?'まずは、各タイルの値を記憶。準備できたら最初の演算へ。':'ひとつ前の答えに、いま表示されている演算をしてください。'}</p></div><div class="progress-row"><span>${isStart?'START':'STEP '+String(round+1).padStart(2,'0')}</span><div class="progress"><div style="width:${(round+1)/config.steps*100}%"></div></div><span class="progress-count">${round+1} / ${config.steps}</span></div><div class="tiles" data-count="${config.tiles}" style="--tiles:${config.tiles}">${Array.from({length:config.tiles},(_,i)=>{if(isStart)return tile(i,number(game.initial[i]),'START','pop');const r=game.rounds[round][i],operand=E.fmt(r.operand),wrapped=r.operand.a.n||r.operand.b.n<0||r.operand.b.d!==1;return tile(i,number(r.op+' '+(wrapped?'('+operand+')':operand)),'STEP '+String(round+1).padStart(2,'0'),'pop');}).join('')}</div><div class="game-actions"><button class="primary" id="next">${isStart?'覚えた → 最初の演算へ':isLast?'計算できた → 回答へ':'計算できた → 次の演算へ'} <span>→</span></button><span class="muted"><kbd>Space</kbd> または <kbd>Enter</kbd> で進む</span></div>${hiddenRun?'<p class="notice">画面を離れたため、今回は練習扱いです。自己ベストには反映されません。</p>':''}</div>`;$('#quit').onclick=setup;$('#next').onclick=next;announce(isStart?'スタート値':`${round+1}手目`);}
function next(){if(phase!=='running')return;if(round<config.steps-1){round++;renderGame();}else{phase='answer';renderAnswer();}}
function renderAnswer(){nav();main.innerHTML=`<div class="game">${gameTop()}<div class="game-title"><div class="tiny">THE FINAL ANSWERS</div><h1>最後の答えを、そろえよう。</h1><p>タイルごとの最終結果を入力してください。回答時間もタイムに含まれます。</p></div><form id="answer-form" novalidate><div class="tiles" data-count="${config.tiles}" style="--tiles:${config.tiles}">${Array.from({length:config.tiles},(_,i)=>tile(i,`<label class="sr-only" for="answer-${i}">タイル${letters[i]}の答え</label><input class="answer-input" id="answer-${i}" name="answer-${i}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="96" placeholder="${config.level==='hard'?'例: 2x - 3':'例: -3 / 2'}" aria-describedby="error-${i}"><div class="input-error" id="error-${i}" aria-live="polite"></div><div class="answer-hint">${config.level==='hard'?'ax + b の形で入力':'整数・小数・分数で入力'}</div>`,'ANSWER')).join('')}</div><div class="game-actions"><button class="primary" type="submit">答え合わせ <span>↗</span></button><span class="muted"><kbd>Tab</kbd> で次のタイルへ · <kbd>Enter</kbd> で判定</span></div></form><p class="center muted">${config.level==='hard'?'2x-3、x/2+1、(x+2)/3 など、同じ式なら正解。':'1/2 と 0.5 は、どちらも同じ答えとして判定します。'}<br>判定は1回。すべての答えを入れてから送信してください。</p>${hiddenRun?'<p class="notice">今回は練習扱いです。自己ベストには反映されません。</p>':''}</div>`;$('#quit').onclick=setup;$('#answer-form').onsubmit=submit;$('#answer-0').focus();}
function submit(event){event.preventDefault();if(phase!=='answer')return;const end=performance.now();let firstError=null;const parsed=[];submitted=[];for(let i=0;i<config.tiles;i++){const input=$('#answer-'+i);submitted.push(input.value);try{const p=E.parse(input.value);if(config.level==='easy'&&p.a.n)throw Error('数字で入力してください');parsed.push(p);$('#error-'+i).textContent='';input.removeAttribute('aria-invalid');}catch(e){$('#error-'+i).textContent=e.message;input.setAttribute('aria-invalid','true');if(firstError===null)firstError=i;}}
if(firstError!==null){$('#answer-'+firstError).focus();return;}const correct=parsed.map((p,i)=>E.equal(p,game.answers[i]));const success=correct.every(Boolean),elapsed=end-start,previous=best(config),ranked=!hiddenRun;outcome={config:{...config},time:elapsed,success,correct,ranked,date:Date.now(),newBest:success&&ranked&&elapsed<previous,previous};if(success&&ranked&&elapsed<previous)bests[key(config)]={...outcome};records.unshift({...outcome,newBest:undefined,previous:undefined});records=records.slice(0,100);save();stopTimers();phase='result';renderResult();}
function renderResult(){nav();const o=outcome;main.innerHTML=`<div class="game"><div class="result-hero"><span class="result-badge">${o.success?(o.ranked?(o.newBest?'NEW PERSONAL BEST':'CHALLENGE CLEAR'):'PRACTICE CLEAR'):'KEEP CHALLENGING'}</span><h1>${o.success?'すべてのタイル、正解。':`${o.correct.filter(Boolean).length} / ${config.tiles} タイル正解。もう一度、挑戦しよう。`}</h1><div class="result-time">${time(o.time)}<small>秒</small></div><p class="muted">${escape(label(config))}<br>${o.success&&o.ranked?(o.previous<Infinity?`これまでの自己ベスト ${time(o.previous)}秒${o.newBest?' → '+time(o.previous-o.time)+'秒速くなりました':''}`:'最初の自己ベストを記録しました。'):o.ranked?'全問正解でタイムが自己ベストに記録されます。':'画面を離れたため、自己ベストには反映されません。'}</p></div><div class="answer-list" style="--tiles:${config.tiles}">${game.answers.map((p,i)=>`<div class="answer-item ${o.correct[i]?'correct':'wrong'}"><strong>TILE ${letters[i]}</strong><span class="status">${o.correct[i]?'✓ 正解':'× 不正解'}</span><p>あなたの答え：${escape(submitted[i])}</p><p>正しい答え</p><div class="answer-value">${escape(E.fmt(p))}</div></div>`).join('')}</div><div class="result-actions"><button class="primary" id="retry">同じ設定で再挑戦 ↗</button><button class="secondary" id="settings">設定を変える</button></div>${!storageOK?'<div class="notice">ブラウザへの保存に失敗しました。この結果はページを閉じると失われる可能性があります。</div>':''}<details class="review"><summary>計算の道筋を振り返る</summary><div class="table-wrap"><table><thead><tr><th>手数</th>${letters.slice(0,config.tiles).map(l=>'<th>タイル '+l+'</th>').join('')}</tr></thead><tbody><tr><td>START</td>${game.initial.map(p=>'<td>'+escape(E.fmt(p))+'</td>').join('')}</tr>${game.rounds.map((row,j)=>`<tr><td>${String(j+1).padStart(2,'0')}</td>${row.map(r=>`<td>${escape(r.op+' ('+E.fmt(r.operand)+')')}<small>→ ${escape(E.fmt(r.next))}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`;$('#retry').onclick=begin;$('#settings').onclick=setup;announce(o.success?'全問正解':'不正解のタイルがあります');}
function showRecords(){page='records';nav();const groups=new Map();Object.values(bests).forEach(r=>groups.set(key(r.config),r));const wins=Array.from(groups.values()).sort((a,b)=>b.date-a.date);main.innerHTML=`<div class="records-page">${shellTitle('YOUR PERSONAL BESTS','昨日の自分を、ひとつ先へ。','自己ベストは設定ごとに保存。自分のペースで、記録を更新しよう。')}${wins.length?`<div class="record-grid">${wins.map(r=>`<article class="panel record-card"><h2>${escape(label(r.config))}</h2><strong>${time(r.time)}<small> 秒</small></strong><small>${new Date(r.date).toLocaleDateString('ja-JP')} に記録</small></article>`).join('')}</div>`:`<div class="panel empty"><div class="empty-icon">⚑</div><h2>最初のベストを、ここに。</h2><p>すべてのタイルに正解すると、<br>このブラウザにあなたのタイムが残ります。</p><button class="secondary" id="empty-start">プレイへ戻る →</button></div>`}<div class="records-heading"><h2>最近のチャレンジ</h2><span class="tiny">${records.length} RUNS</span></div>${records.length?`<div class="table-wrap"><table><thead><tr><th>日時</th><th>設定</th><th>正解</th><th>タイム</th><th>結果</th></tr></thead><tbody>${records.slice(0,20).map(r=>`<tr><td>${new Date(r.date).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${escape(label(r.config))}</td><td>${r.correct.filter(Boolean).length} / ${r.config.tiles}</td><td>${time(r.time)}秒</td><td>${!r.ranked?'練習':r.success?'✓ クリア':'未クリア'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">まだチャレンジの記録がありません。</p>'}<p class="muted" style="margin-top:25px">記録はこの端末・このブラウザに保存されます。ブラウザのデータを消すと記録も消えます。<br>最近の挑戦は100回まで、自己ベストはそれとは別に保存します。</p>${!storageOK?'<p class="notice">現在、このブラウザへの保存が利用できません。</p>':''}</div>`;if($('#empty-start'))$('#empty-start').onclick=setup;}
function help(){page='help';nav();main.innerHTML=`<div class="help-page">${shellTitle('HOW TO PLAY','頭の中に、計算の居場所を。','タイルごとにひとつの答えを持ち続ける、並列暗算ゲームです。')}<div class="help-grid"><section class="panel help-card"><h2>01　覚える → 更新する → 答える</h2><p>最初にタイルA〜Dのスタート値が表示されます。覚えたら次へ。毎手、全タイルに異なる演算が同時に出ます。</p><p>各タイルの「ひとつ前の答え」に演算を適用してください。過去の値は表示されません。指定の手数が終わったら最終結果を入力します。</p><div class="example">A : 7 → ＋ 3 → × 2 → 答えは 20</div></section><section class="panel help-card"><h2>02　Easy と Hard</h2><p><strong>Easy / 整数</strong>：途中の答えもすべて整数。<br><strong>Easy / 簡単な分数</strong>：分母12以下の分数も登場。小数または分数で答えられます。<br><strong>Hard</strong>：xを含む一次式を計算。掛け算・割り算の相手は定数なので、答えは常に ax + b の形です。</p><div class="example">2x + 1 → ＋ (x − 3) → 3x − 2</div></section><section class="panel help-card"><h2>03　操作と答えの書き方</h2><ul><li><kbd>Space</kbd> / <kbd>Enter</kbd>：次の演算へ</li><li>回答中の <kbd>Tab</kbd>：次のタイルへ</li><li>回答中の <kbd>Enter</kbd>：すべての答えを判定</li><li>タッチ操作：画面下のボタンで進む</li></ul><p>分数は 1/2、小数は 0.5 と入力できます。Hardは 2x-3、x/2+1、(x+2)/3 など。数学的に同じ式なら正解です。定数になる場合は数字だけでもOK。</p></section><section class="panel help-card"><h2>04　タイムと自己ベスト</h2><p>3秒のカウントダウン後、スタート値の表示から回答送信までを計測。全問正解したときだけ自己ベストの対象になります。</p><p>入力形式のエラーは修正できますが、正誤判定は1回です。タイムは設定ごとに記録。途中で別タブなどに移動した回は練習扱いになります。</p></section><section class="panel help-card wide"><h2>まずは「2タイル × 5手」から。</h2><p>慣れてきたら手数を伸ばし、次にタイルを増やすのがおすすめ。ミスした回も計算履歴で「どこでずれたか」を振り返れます。速さを求める前に、各タイルの値を確実に更新してみてください。</p><button class="secondary" id="practice">2タイル・5手で練習する →</button></section></div></div>`;$('#practice').onclick=()=>{config={tiles:2,steps:5,level:'easy',number:'integer'};save();setup();};}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(['running','answer','countdown'].includes(phase))return;phase='setup';if(b.dataset.page==='records')showRecords();else if(b.dataset.page==='help')help();else setup();});
$('.brand').onclick=e=>{e.preventDefault();if(!['running','answer','countdown'].includes(phase))setup();};
document.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;if(phase==='running'&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();next();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['running','answer'].includes(phase))hiddenRun=true;if(!document.hidden&&phase==='running')renderGame();});
setup();
})();
</script></body></html>
